# Connection profile baked into the image. Contains no secrets: every value comes
# from environment variables at runtime, and the ones with a default are optional.
#
# For key-pair auth instead of a password, replace `password` with:
#   private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
#   private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
myproject:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'SYSADMIN') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'MYPROJECT') }}"
      # dbt builds models here; the sources in models/sources.yml live in RAW
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'ANALYTICS') }}"
      threads: 4
